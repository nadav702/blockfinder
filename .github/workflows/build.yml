name: Build BlockAtlas jar
on:
  push:
    branches: [blockatlas]
    paths-ignore: ['dist/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }

      - name: Resolve latest Fabric versions for 26.3
        run: |
          set +e
          M=https://maven.fabricmc.net/net/fabricmc
          LOOM=$(curl -s $M/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml | grep -oP '(?<=<release>)[^<]+')
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version')
          FAPI=$(curl -s "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%2226.3%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].version_number')
          [ -n "$LOOM" ] && sed -i "s/^loom_version=.*/loom_version=$LOOM/" gradle.properties
          [ -n "$LOADER" ] && [ "$LOADER" != null ] && sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties
          [ -n "$FAPI" ] && [ "$FAPI" != null ] && sed -i "s/^fabric_api_version=.*/fabric_api_version=$FAPI/" gradle.properties
          echo "::notice::loom=$LOOM loader=$LOADER fabric-api=$FAPI"
          cat gradle.properties

      - name: Dump 26.3 API (diagnostics)
        run: |
          set +e
          chmod +x gradlew
          mkdir -p dist
          CP=$(./gradlew -q printCompileClasspath --no-daemon | tail -1)
          echo "$CP" | tr ':' '\n' > dist/classpath.txt
          OUT=dist/api.txt; : > $OUT
          for j in $(echo "$CP" | tr ':' ' '); do
            unzip -Z1 "$j" 2>/dev/null | grep -E '\.class$' | grep -vE '\$[0-9]' | sed "s|^|$(basename $j) :: |" ; done \
            | grep -E 'blaze3d/|client/renderer/RenderPipelines|StagedVertexBuffer|InputConstants|client/input/|lwjgl|sdl|glfw|rendering/v1/level/|rendering/v1/hud/|keymapping|KeyMapping|GuiGraphicsExtractor|RenderType' > dist/classes.txt
          for c in com.mojang.blaze3d.platform.InputConstants 'com.mojang.blaze3d.platform.InputConstants$Type' \
                   net.minecraft.client.renderer.RenderPipelines net.minecraft.client.renderer.StagedVertexBuffer \
                   'net.minecraft.client.renderer.StagedVertexBuffer$ExecuteInfo' 'net.minecraft.client.renderer.StagedVertexBuffer$Draw' \
                   com.mojang.blaze3d.systems.RenderSystem com.mojang.blaze3d.pipeline.RenderTarget \
                   net.minecraft.client.input.KeyEvent net.minecraft.client.input.MouseButtonEvent net.minecraft.client.input.CharacterEvent \
                   net.minecraft.client.input.InputWithModifiers net.minecraft.client.KeyMapping \
                   net.minecraft.client.gui.GuiGraphicsExtractor net.minecraft.client.gui.screens.Screen \
                   net.minecraft.world.level.chunk.LevelChunkSection \
                   net.fabricmc.fabric.api.client.rendering.v1.level.LevelRenderContext \
                   net.fabricmc.fabric.api.client.rendering.v1.level.LevelRenderEvents ; do
            echo "=================== $c" >> $OUT
            javap -cp "$CP" -public "$c" >> $OUT 2>&1
          done
          for pat in RenderPipeline PrimitiveTopology GpuBufferSlice RenderPass GpuTextureView VertexFormat; do
            C=$(grep -E "/$pat\.class$" dist/classes.txt | head -1 | sed 's/.* :: //; s/\.class$//; s|/|.|g')
            echo "=================== $pat -> $C" >> $OUT
            [ -n "$C" ] && javap -cp "$CP" -public "$C" >> $OUT 2>&1
          done

      - name: Build
        id: build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
          echo "ok=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Publish jar + log back to branch
        if: always()
        run: |
          mkdir -p dist
          rm -f dist/*.jar dist/build.log dist/STATUS
          cp build.log dist/build.log || true
          cp gradle.properties dist/resolved-gradle.properties
          ls build/libs/ 2>/dev/null | grep -v sources | while read f; do cp "build/libs/$f" dist/; done
          if ls dist/*.jar >/dev/null 2>&1; then echo SUCCESS > dist/STATUS; else echo FAILED > dist/STATUS; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f dist
          git commit -m "Build output ($(cat dist/STATUS)) [skip ci]" || true
          git push

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: blockatlas
          path: dist/
