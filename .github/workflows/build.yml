name: Build BlockAtlas jar
on:
  push:
    branches: [blockatlas]
    paths-ignore: ['dist/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blockatlas-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }

      - name: Resolve latest Fabric versions for 26.3
        run: |
          set +e
          M=https://maven.fabricmc.net/net/fabricmc
          LOOM=$(curl -s $M/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml | grep -oP '(?<=<release>)[^<]+')
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version')
          FAPI=$(curl -s "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%2226.3%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].version_number')
          [ -n "$LOOM" ] && sed -i "s/^loom_version=.*/loom_version=$LOOM/" gradle.properties
          [ -n "$LOADER" ] && [ "$LOADER" != null ] && sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties
          [ -n "$FAPI" ] && [ "$FAPI" != null ] && sed -i "s/^fabric_api_version=.*/fabric_api_version=$FAPI/" gradle.properties
          echo "::notice::loom=$LOOM loader=$LOADER fabric-api=$FAPI"
          cat gradle.properties

      - name: Dump 26.3 API (diagnostics)
        run: |
          set +e
          chmod +x gradlew
          mkdir -p dist
          CP=$(./gradlew -q printCompileClasspath --no-daemon | tail -1)
          echo "$CP" | tr ':' '\n' > dist/classpath.txt
          OUT=dist/api.txt; : > $OUT
          for j in $(echo "$CP" | tr ':' ' '); do
            unzip -Z1 "$j" 2>/dev/null | grep -E '\.class$' | grep -vE '\$[0-9]' | sed "s|^|$(basename $j) :: |" ; done \
            | grep -E 'blaze3d/|client/renderer/RenderPipelines|StagedVertexBuffer|InputConstants|client/input/|lwjgl|sdl|glfw|rendering/v1/level/|rendering/v1/hud/|keymapping|KeyMapping|GuiGraphicsExtractor|RenderType' > dist/classes.txt
          for c in net.minecraft.world.entity.Marker net.minecraft.client.player.ClientInput net.minecraft.client.player.KeyboardInput \
                   net.minecraft.world.entity.player.Input net.minecraft.client.Options \
                   net.fabricmc.fabric.api.event.player.AttackBlockCallback net.fabricmc.fabric.api.event.player.UseBlockCallback \
                   net.fabricmc.fabric.api.event.player.UseItemCallback net.fabricmc.fabric.api.event.player.AttackEntityCallback \
                   net.fabricmc.fabric.api.event.player.UseEntityCallback net.minecraft.client.gui.components.AbstractWidget \
                   net.minecraft.client.gui.components.EditBox ; do
            echo "=================== $c" >> $OUT
            javap -cp "$CP" -public "$c" >> $OUT 2>&1
          done
          for c in net.minecraft.world.entity.Entity net.minecraft.client.Minecraft net.minecraft.client.player.LocalPlayer net.minecraft.world.level.Level; do
            echo "=================== $c (filtered)" >> $OUT
            javap -cp "$CP" -public "$c" 2>&1 | grep -E "turn\(|setPos\(|xo;|yo;|zo;|RotO;|setYRot|setXRot|CameraEntity|isClientSide|sendOverlayMessage|displayClientMessage|getEyePosition|public .* gui;|options;" >> $OUT
          done
          echo "=================== capturesInput users" >> $OUT
          for c in net.minecraft.client.gui.screens.Screen net.minecraft.client.Minecraft net.minecraft.client.gui.components.EditBox net.minecraft.client.gui.Gui; do
            javap -cp "$CP" -c -p "$c" 2>/dev/null | grep -n -B3 -A3 "capturesInput\|TextInput" | sed "s|^|$c: |" >> $OUT
          done

      - name: Build
        id: build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
          echo "ok=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Publish jar + log back to branch
        if: always()
        run: |
          mkdir -p dist
          rm -f dist/*.jar dist/build.log dist/STATUS
          cp build.log dist/build.log || true
          cp gradle.properties dist/resolved-gradle.properties
          ls build/libs/ 2>/dev/null | grep -v sources | while read f; do cp "build/libs/$f" dist/; done
          if ls dist/*.jar >/dev/null 2>&1; then echo SUCCESS > dist/STATUS; else echo FAILED > dist/STATUS; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f dist
          git commit -m "Build output ($(cat dist/STATUS)) [skip ci]" || true
          ok=0
          for i in 1 2 3; do git pull --rebase -X theirs origin blockatlas && git push && { ok=1; break; }; sleep 3; done
          [ "$ok" = 1 ] || { echo "::error::could not publish build output"; exit 1; }

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: blockatlas
          path: dist/
